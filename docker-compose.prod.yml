# Topologie de référence pour un déploiement mono-VM (Docker sur un serveur unique —
# DigitalOcean, OVH, Scaleway, EC2...). Pour un déploiement à plus grande échelle,
# PostgreSQL et Redis devraient être des services managés externes (RDS, ElastiCache,
# Neon, Upstash...) plutôt que des conteneurs sur la même machine que l'application —
# ce fichier reste néanmoins un point de départ honnête pour une première mise en ligne,
# pas une architecture Kubernetes multi-nœuds (cf. Phase 2/3 de la roadmap d'architecture).
#
# Utilisation : docker compose -f docker-compose.prod.yml --env-file backend/.env up -d

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: campaignai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: campaignai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Pas de port exposé à l'hôte en production — seul le réseau Docker interne y accède.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://campaignai:${POSTGRES_PASSWORD}@postgres:5432/campaignai
      REDIS_HOST: redis
      NODE_ENV: production
    depends_on:
      - postgres
      - redis
    ports:
      - "3001:3001"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
