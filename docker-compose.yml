version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: campaign-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campaignai
      POSTGRES_PASSWORD: campaignai
      POSTGRES_DB: campaignai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: campaign-ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
